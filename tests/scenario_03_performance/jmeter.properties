# 시나리오 03 JMeter 고정 옵션 (비밀 없음).
# 실행 담당이 -q로 추가 로드한다. JTL은 요청별 결과 원본이며 HTML 보고서는 보조 자료다.

# 명령행 모드에서만 실행하고 JTL은 필요한 열만 버퍼링한다.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.default_delimiter=,
jmeter.save.saveservice.autoflush=false
jmeter.save.saveservice.subresults=false
jmeter.save.saveservice.assertions=false
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.url=true
jmeter.save.saveservice.filename=false
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.thread_counts=false
jmeter.save.saveservice.sample_count=false

# 지연·연결·성공 판정 원자료를 보존한다. Latency는 전체 지연으로 쓰지 않는다.
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=false
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.idle_time=true

# 호출 계측값을 JTL에 연결한다. 이름은 run_performance.py의 SAMPLE_VARIABLES와 같다.
sample_variables=m3_run_id,m3_phase,m3_thread_name,m3_request_sequence,m3_start_ns,m3_deadline_ns,m3_decision_ns,m3_observed_decision_ns,m3_return_ns,m3_outcome,m3_processing_unknown,m3_client_elapsed_ns,m3_observed_elapsed_ns,m3_late_return,m3_http_code,m3_jdbc_affected,m3_error,m3_connection_id

# 실패한 증가를 다시 보내지 않는다. 서버가 닫은 연결 뒤 새 연결 생성은 재시도가 아니다.
httpclient4.retrycount=0
httpclient4.request_sent_retry_enabled=false
httpsampler.max_redirects=0

# JSR223 Groovy 파일 스크립트는 컴파일 캐시를 사용한다.
jsr223.compiled_scripts_cache_size=100

# GUI 리스너·실시간 그래프를 쓰지 않는다.
summariser.name=
jmeter.reportgenerator.exporter.html=false

# 시험 전용 after-probe 기본값. 실제 after 연결ID 조회는 JMX의 대상 분기에서만 한다.
m3.test.after_probe=false
