[tool:pytest]
norecursedirs =
    mutants
    .venv
    .git
    .hypothesis
    stress-results

[mutmut]
source_paths =
    storage.py
    app.py
only_mutate = storage.py
pytest_add_cli_args_test_selection =
    tests/scenario_01_storage/test_storage.py
    tests/scenario_01_storage/test_storage_invalid_input.py
    tests/scenario_01_storage/test_json_types_extension.py
    tests/scenario_01_storage/test_ttl_storage.py
    tests/scenario_01_storage/test_ttl_active.py
    tests/scenario_01_storage/test_ttl_http.py
    tests/scenario_01_storage/test_ttl_timer.py
    tests/scenario_01_storage/test_mutation_gaps.py
    tests/scenario_02_concurrent_counter/test_counter_storage.py
