<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 265" width="740" height="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">작은 GET 요청 병목 분석과 httptools 적용 효과</title>
  <desc id="desc">단건 GET small 기준 초기 h11은 207.8µs(HTTP 73.7%, FastAPI 24.5%, 저장소 1.1%), httptools 적용 후 125.9µs(-39.4%)입니다. 동시성 50 지연 p50은 h11 8.52ms(5,052 req/s)에서 httptools 5.62ms(-34.0%, 7,813 req/s)로 줄었습니다.</desc>
  <rect width="740" height="265" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Header -->
  <text x="24" y="30" font-size="15.5" font-weight="700" fill="#1f2328">작은 GET 요청 병목 분석과 httptools 적용 효과</text>
  <text x="24" y="49" font-size="11.5" fill="#57606a">저장소(2.4µs)가 아니라 앞단 HTTP 파서와 프레임워크가 지배 · Raw Socket keep-alive 실측</text>

  <!-- Legend -->
  <rect x="24" y="62" width="11" height="11" rx="2" fill="#cf222e" opacity="0.85"/>
  <text x="40" y="72" font-size="11" fill="#1f2328">TCP · uvicorn · HTTP 파서</text>
  <rect x="190" y="62" width="11" height="11" rx="2" fill="#0969da" opacity="0.85"/>
  <text x="206" y="72" font-size="11" fill="#1f2328">FastAPI · JSON</text>
  <rect x="304" y="62" width="11" height="11" rx="2" fill="#1a7f37"/>
  <text x="320" y="72" font-size="11" fill="#1f2328">MiniRedis 저장소 (2.4µs)</text>

  <line x1="24" y1="83" x2="716" y2="83" stroke="#eaeef2"/>

  <!-- Section 1: C=1 Latency (1 µs = 2.0 px, x start = 148) -->
  <text x="24" y="103" font-size="13" font-weight="700" fill="#1f2328">1. 단건 1요청 지연 (C=1, p50 µs · 짧을수록 빠름)</text>

  <!-- Initial h11: 207.8 us -> 415.6px -->
  <text x="24" y="129" font-size="12" font-weight="600" fill="#57606a">초기 (h11)</text>
  <rect x="148" y="116" width="306" height="18" rx="3" fill="#cf222e" opacity="0.85"/>
  <rect x="455" y="116" width="102" height="18" rx="3" fill="#0969da" opacity="0.85"/>
  <rect x="558" y="116" width="5" height="18" rx="1" fill="#1a7f37"/>
  <text x="301" y="129" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">153.1µs (73.7%)</text>
  <text x="506" y="129" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">51.1µs</text>
  <text x="571" y="129" font-size="12" font-weight="700" fill="#1f2328">207.8 µs</text>

  <!-- httptools: 125.9 us -> 251.8px -->
  <text x="24" y="157" font-size="12" font-weight="700" fill="#0969da">httptools 적용</text>
  <rect x="148" y="144" width="152" height="18" rx="3" fill="#cf222e" opacity="0.85"/>
  <rect x="301" y="144" width="95" height="18" rx="3" fill="#0969da" opacity="0.85"/>
  <rect x="397" y="144" width="5" height="18" rx="1" fill="#1a7f37"/>
  <text x="224" y="157" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">75.9µs (60.4%)</text>
  <text x="348" y="157" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">47.5µs</text>
  <text x="410" y="157" font-size="12" font-weight="700" fill="#0969da">125.9 µs (-39.4%)</text>

  <line x1="24" y1="175" x2="716" y2="175" stroke="#eaeef2"/>

  <!-- Section 2: C=50 Latency (1 ms = 45px, x start = 148) -->
  <text x="24" y="196" font-size="13" font-weight="700" fill="#1f2328">2. 동시 요청 지연 (C=50, N=5,000 GET · p50 ms · 짧을수록 빠름)</text>

  <!-- h11: 8.52 ms -> 383.4px -->
  <text x="24" y="222" font-size="12" font-weight="600" fill="#57606a">h11</text>
  <rect x="148" y="209" width="383" height="18" rx="3" fill="#8c959f"/>
  <text x="539" y="222" font-size="12" font-weight="600" fill="#57606a">8.52 ms (5,052 req/s)</text>

  <!-- httptools: 5.62 ms -> 252.9px -->
  <text x="24" y="248" font-size="12" font-weight="700" fill="#0969da">httptools</text>
  <rect x="148" y="235" width="253" height="18" rx="3" fill="#0969da"/>
  <text x="409" y="248" font-size="12" font-weight="700" fill="#0969da">5.62 ms (-34.0% · 7,813 req/s)</text>
</svg>
