<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <rect width="720" height="260" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#1f2328">Flask vs FastAPI 처리량 (req/s)</text>

  <!-- Legend -->
  <line x1="480" y1="29" x2="502" y2="29" stroke="#0969da" stroke-width="3"/>
  <circle cx="491" cy="29" r="3.5" fill="#0969da"/>
  <text x="508" y="33" font-size="11.5" font-weight="600" fill="#1f2328">FastAPI</text>

  <line x1="578" y1="29" x2="600" y2="29" stroke="#8c959f" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="589" cy="29" r="3" fill="#8c959f"/>
  <text x="606" y="33" font-size="11.5" fill="#57606a">Flask</text>

  <!-- Gridlines: x=80..660, y=58..218 (height=160, max=4500) -->
  <!-- y = 218 - (val / 4500) * 160 -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="80" y1="218" x2="660" y2="218"/>
    <line x1="80" y1="182.4" x2="660" y2="182.4"/>
    <line x1="80" y1="146.9" x2="660" y2="146.9"/>
    <line x1="80" y1="111.3" x2="660" y2="111.3"/>
    <line x1="80" y1="75.8" x2="660" y2="75.8"/>
  </g>
  <g font-size="11" fill="#656d76" text-anchor="end">
    <text x="70" y="222">0</text>
    <text x="70" y="186">1,000</text>
    <text x="70" y="151">2,000</text>
    <text x="70" y="115">3,000</text>
    <text x="70" y="80">4,000</text>
  </g>

  <!-- X positions: 145, 305, 465, 625 -->
  <g font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">
    <text x="145" y="240">C=1</text>
    <text x="305" y="240">C=10</text>
    <text x="465" y="240">C=50</text>
    <text x="625" y="240">C=100</text>
  </g>

  <!-- Flask: 1395->168.4, 2335->135.0, 2245->138.2, 2254->137.9 -->
  <polyline fill="none" stroke="#8c959f" stroke-width="2.5" stroke-dasharray="4,3"
    points="145,168.4 305,135.0 465,138.2 625,137.9"/>
  <g fill="#8c959f">
    <circle cx="145" cy="168.4" r="3.5"/>
    <circle cx="305" cy="135.0" r="3.5"/>
    <circle cx="465" cy="138.2" r="3.5"/>
    <circle cx="625" cy="137.9" r="3.5"/>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="145" y="184">1,395</text>
    <text x="305" y="151">2,335</text>
    <text x="465" y="154">2,245</text>
    <text x="625" y="154">2,254</text>
  </g>

  <!-- FastAPI: 1620->160.4, 3813->82.4, 3786->83.4, 3715->85.9 -->
  <polyline fill="none" stroke="#0969da" stroke-width="3"
    points="145,160.4 305,82.4 465,83.4 625,85.9"/>
  <g fill="#0969da" stroke="#ffffff" stroke-width="1.5">
    <circle cx="145" cy="160.4" r="5"/>
    <circle cx="305" cy="82.4" r="5"/>
    <circle cx="465" cy="83.4" r="5"/>
    <circle cx="625" cy="85.9" r="5"/>
  </g>
  <g font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">
    <text x="145" y="149">1,620</text>
    <text x="305" y="71">3,813</text>
    <text x="465" y="72">3,786</text>
    <text x="625" y="74">3,715</text>
  </g>
</svg>
