<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <rect width="760" height="300" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Header -->
  <text x="28" y="34" font-size="16" font-weight="700" fill="#1f2328">1. SQL(MySQL 8.4)과 Mini Redis 성능 비교 (JMeter)</text>
  <text x="28" y="54" font-size="12" fill="#656d76">동일 카운터 1 증가 · N=10,000 · 5회 중앙값 (MySQL: sync_binlog=1, innodb_flush_log_at_trx_commit=1)</text>

  <!-- Legend -->
  <rect x="520" y="22" width="12" height="12" rx="3" fill="#0969da"/>
  <text x="537" y="32" font-size="12" font-weight="600" fill="#1f2328">Mini Redis HTTP (Flask)</text>
  <rect x="520" y="42" width="12" height="12" rx="3" fill="#cf222e"/>
  <text x="537" y="52" font-size="12" font-weight="600" fill="#1f2328">MySQL 8.4 (JDBC)</text>

  <!-- Gridlines: x=100..640 (width=540, max=3000 -> 0.18px per req/s) -->
  <!-- 0:100, 1000:280, 2000:460, 3000:640 -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="100" y1="74" x2="100" y2="258"/>
    <line x1="280" y1="74" x2="280" y2="258"/>
    <line x1="460" y1="74" x2="460" y2="258"/>
    <line x1="640" y1="74" x2="640" y2="258"/>
  </g>
  <g font-size="11" fill="#656d76" text-anchor="middle">
    <text x="100" y="276">0</text>
    <text x="280" y="276">1,000</text>
    <text x="460" y="276">2,000</text>
    <text x="640" y="276">3,000 req/s</text>
  </g>

  <!-- C=1: MR=1593.6 (286.8px), MySQL=66.7 (12.0px) -->
  <text x="36" y="102" font-size="13" font-weight="700" fill="#1f2328">C = 1</text>
  <rect x="100" y="82" width="286.8" height="15" rx="3" fill="#0969da"/>
  <text x="394" y="94" font-size="12" font-weight="700" fill="#0969da">1,593.6 req/s (p50 0.47ms · 23.9배)</text>
  <rect x="100" y="100" width="12.0" height="13" rx="3" fill="#cf222e"/>
  <text x="118" y="111" font-size="11.5" font-weight="600" fill="#cf222e">66.7 req/s (p50 15.90ms)</text>

  <!-- C=10: MR=2582.5 (464.8px), MySQL=82.6 (14.9px) -->
  <text x="36" y="148" font-size="13" font-weight="700" fill="#1f2328">C = 10</text>
  <rect x="100" y="128" width="464.8" height="15" rx="3" fill="#0969da"/>
  <text x="572" y="140" font-size="12" font-weight="700" fill="#0969da">2,582.5 req/s (31.2배)</text>
  <rect x="100" y="146" width="14.9" height="13" rx="3" fill="#cf222e"/>
  <text x="121" y="157" font-size="11.5" font-weight="600" fill="#cf222e">82.6 req/s (p50 118.81ms)</text>

  <!-- C=50: MR=2544.8 (458.1px), MySQL=82.5 (14.8px) -->
  <text x="36" y="194" font-size="13" font-weight="700" fill="#1f2328">C = 50</text>
  <rect x="100" y="174" width="458.1" height="15" rx="3" fill="#0969da"/>
  <text x="565" y="186" font-size="12" font-weight="700" fill="#0969da">2,544.8 req/s (30.9배)</text>
  <rect x="100" y="192" width="14.8" height="13" rx="3" fill="#cf222e"/>
  <text x="121" y="203" font-size="11.5" font-weight="600" fill="#cf222e">82.5 req/s (p50 601.12ms)</text>

  <!-- C=100: MR=2482.9 (446.9px), MySQL=82.2 (14.8px) -->
  <text x="36" y="240" font-size="13" font-weight="700" fill="#1f2328">C = 100</text>
  <rect x="100" y="220" width="446.9" height="15" rx="3" fill="#0969da"/>
  <text x="554" y="232" font-size="12" font-weight="700" fill="#0969da">2,482.9 req/s (30.2배)</text>
  <rect x="100" y="238" width="14.8" height="13" rx="3" fill="#cf222e"/>
  <text x="121" y="249" font-size="11.5" font-weight="600" fill="#cf222e">82.2 req/s (p50 1,208.90ms)</text>
</svg>
