<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <rect width="720" height="260" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#1f2328">Mini Redis vs MySQL 8.4 처리량 중앙값 (건/초)</text>

  <!-- Legend -->
  <rect x="460" y="23" width="11" height="11" rx="2" fill="#0969da"/>
  <text x="476" y="33" font-size="11.5" fill="#1f2328">Mini Redis</text>
  <rect x="560" y="23" width="11" height="11" rx="2" fill="#cf222e"/>
  <text x="576" y="33" font-size="11.5" fill="#1f2328">MySQL 8.4</text>

  <!-- Gridlines: x=86..626 (540px, max=5000 -> 0.108px/req) -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="86" y1="54" x2="86" y2="220"/>
    <line x1="194" y1="54" x2="194" y2="220"/>
    <line x1="302" y1="54" x2="302" y2="220"/>
    <line x1="410" y1="54" x2="410" y2="220"/>
    <line x1="518" y1="54" x2="518" y2="220"/>
    <line x1="626" y1="54" x2="626" y2="220"/>
  </g>
  <g font-size="11" fill="#656d76" text-anchor="middle">
    <text x="86" y="238">0</text>
    <text x="194" y="238">1,000</text>
    <text x="302" y="238">2,000</text>
    <text x="410" y="238">3,000</text>
    <text x="518" y="238">4,000</text>
    <text x="626" y="238">5,000</text>
  </g>

  <!-- C=1 -->
  <text x="24" y="79" font-size="12.5" font-weight="600" fill="#1f2328">C=1</text>
  <rect x="86" y="61" width="204.7" height="13" rx="3" fill="#0969da"/>
  <text x="298" y="72" font-size="11.5" font-weight="600" fill="#0969da">1,895.5</text>
  <rect x="86" y="77" width="7.1" height="11" rx="3" fill="#cf222e"/>
  <text x="99" y="87" font-size="11" fill="#cf222e">65.5</text>

  <!-- C=10 -->
  <text x="24" y="121" font-size="12.5" font-weight="600" fill="#1f2328">C=10</text>
  <rect x="86" y="103" width="437.8" height="13" rx="3" fill="#0969da"/>
  <text x="531" y="114" font-size="11.5" font-weight="600" fill="#0969da">4,053.6</text>
  <rect x="86" y="119" width="8.9" height="11" rx="3" fill="#cf222e"/>
  <text x="101" y="129" font-size="11" fill="#cf222e">82.8</text>

  <!-- C=50 -->
  <text x="24" y="163" font-size="12.5" font-weight="600" fill="#1f2328">C=50</text>
  <rect x="86" y="145" width="435.0" height="13" rx="3" fill="#0969da"/>
  <text x="528" y="156" font-size="11.5" font-weight="600" fill="#0969da">4,027.9</text>
  <rect x="86" y="161" width="8.9" height="11" rx="3" fill="#cf222e"/>
  <text x="101" y="171" font-size="11" fill="#cf222e">82.7</text>

  <!-- C=100 -->
  <text x="24" y="205" font-size="12.5" font-weight="600" fill="#1f2328">C=100</text>
  <rect x="86" y="187" width="433.6" height="13" rx="3" fill="#0969da"/>
  <text x="527" y="198" font-size="11.5" font-weight="600" fill="#0969da">4,014.5</text>
  <rect x="86" y="203" width="8.9" height="11" rx="3" fill="#cf222e"/>
  <text x="101" y="213" font-size="11" fill="#cf222e">82.5</text>
