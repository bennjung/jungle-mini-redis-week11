<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실행 모니터 · Mini Redis 날씨 데모</title>
  <style>
    :root {
      --paper: #f3efe4;
      --ink: #1e1b16;
      --muted: #6b6458;
      --rule: #d7cfbe;
      --get: #0b6b62;
      --lock: #9a5a00;
      --origin: #2f4f8f;
      --put: #2d6b33;
      --release: #5d5a52;
      --error: #a3271f;
      --display: "Iowan Old Style", "Palatino Linotype", "Noto Serif KR", "Songti SC", serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .masthead {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2rem;
      padding: 1.4rem 2rem 1rem;
      background: var(--paper);
      border-bottom: 3px solid var(--ink);
    }

    .eyebrow {
      margin: 0 0 .35rem;
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(2.6rem, 6vw, 5.5rem);
      font-weight: 600;
      line-height: .9;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: .9rem 0 0;
      font-size: clamp(.85rem, 1.1vw, 1rem);
      color: var(--muted);
    }

    .status-block {
      flex: 0 0 auto;
      text-align: right;
    }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .5rem .7rem;
      border: 2px solid var(--ink);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .02em;
      background: var(--paper);
    }

    .connection .dot {
      width: .7rem;
      height: .7rem;
      border-radius: 50%;
      background: var(--muted);
    }

    .connection[data-state="online"] .dot { background: var(--put); }
    .connection[data-state="offline"] { color: var(--error); border-color: var(--error); }
    .connection[data-state="offline"] .dot { background: var(--error); }

    .legend {
      margin: .6rem 0 0;
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .meters {
      display: flex;
      flex-wrap: wrap;
      gap: 0 2.5rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--rule);
      background: var(--paper);
    }

    .meter-label {
      display: block;
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .meters strong {
      display: block;
      margin-top: .15rem;
      font-family: var(--display);
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      font-weight: 600;
    }

    main {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .empty {
      padding: 4rem 0 2rem;
      max-width: 34rem;
    }

    .empty h2 {
      margin: 0 0 .8rem;
      font-family: var(--display);
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 500;
      line-height: 1;
    }

    .empty p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .event-log {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .event {
      display: grid;
      grid-template-columns: 6.5rem 2.6rem 10rem minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 1rem;
      padding: .95rem 0;
      border-bottom: 1px solid var(--rule);
      font-size: clamp(1.05rem, 1.55vw, 1.4rem);
      line-height: 1.35;
    }

    .event.request-event {
      margin-top: 1.2rem;
      border-top: 3px solid var(--ink);
    }

    .event.end-event {
      margin-bottom: 1.2rem;
      border-bottom: 3px double var(--ink);
    }

    .time {
      color: var(--muted);
      font-size: .9rem;
    }

    .step {
      font-family: var(--display);
      font-size: 1.45em;
      line-height: 1;
      color: var(--muted);
    }

    .kind {
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .body {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .25rem .9rem;
      min-width: 0;
    }

    .message {
      font-size: 1.12em;
      overflow-wrap: anywhere;
    }

    .target {
      color: var(--muted);
      font-size: .82em;
      overflow-wrap: anywhere;
    }

    .request {
      padding: .15rem .45rem;
      border: 1px solid var(--rule);
      border-radius: 2px;
      color: var(--muted);
      font-size: .82rem;
      white-space: nowrap;
    }

    .meta {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .status-chip {
      padding: .1rem .5rem;
      border: 1px solid currentColor;
      font-size: .82rem;
      font-weight: 700;
    }

    .status-chip.ok { color: var(--put); }
    .status-chip.failed { color: var(--error); }

    .event[data-kind="GET"] .kind { color: var(--get); }
    .event[data-kind="LOCK ACQUIRE"] .kind { color: var(--lock); }
    .event[data-kind="OPEN-METEO"] .kind { color: var(--origin); }
    .event[data-kind="PUT"] .kind { color: var(--put); }
    .event[data-kind="LOCK RELEASE"] .kind { color: var(--release); }
    .event[data-kind="REQUEST"] .kind,
    .event[data-kind="END"] .kind { color: var(--ink); }

    .event[data-kind="ERROR"] {
      margin: 0 -1rem;
      padding-left: 1rem;
      padding-right: 1rem;
      border-left: 6px solid var(--error);
      background: color-mix(in srgb, var(--error) 8%, transparent);
    }

    .event[data-kind="ERROR"] .kind { color: var(--error); }

    .footnote {
      padding: 1.5rem 0 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .masthead {
        align-items: flex-start;
        flex-direction: column;
        gap: 1rem;
        padding: 1.2rem 1.2rem .9rem;
      }

      .status-block { text-align: left; }
      .meters { padding: 1rem 1.2rem; }
      main { padding: 0 1.2rem 3rem; }

      .event {
        grid-template-columns: 4.5rem 2rem minmax(0, 1fr);
        gap: .35rem .7rem;
      }

      .kind { grid-column: 3; }
      .body { grid-column: 1 / -1; }
      .meta { grid-column: 1 / -1; justify-self: start; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div>
      <p class="eyebrow">Mini Redis · Weather Pipeline</p>
      <h1>실행 모니터</h1>
      <p class="subtitle">연결 이후 이벤트만 · 자동 아래 이동 · 새로고침 시 목록 초기화</p>
    </div>
    <div class="status-block">
      <span id="connection" class="connection" data-state="connecting">
        <span class="dot" aria-hidden="true"></span>
        <span id="connection-text">연결 중…</span>
      </span>
      <p class="legend">요청 ID · 연결 상태</p>
    </div>
  </header>

  <section class="meters" aria-label="모니터 요약">
    <div>
      <span class="meter-label">이벤트</span>
      <strong id="event-count">0</strong>
    </div>
    <div>
      <span class="meter-label">원본 호출 누적</span>
      <strong id="origin-count">—</strong>
    </div>
    <div>
      <span class="meter-label">마지막 이벤트</span>
      <strong id="last-seen">—</strong>
    </div>
  </section>

  <main>
    <div id="empty" class="empty">
      <h2>아직 이벤트가 없습니다.</h2>
      <p>날씨 탭에서 조회를 시작하면 실제 GET, 락 획득, 원본 호출, 저장, 락 해제가 이곳에 한 줄씩 쌓입니다.</p>
    </div>
    <ol id="event-log" class="event-log" role="log" aria-live="polite" aria-relevant="additions"></ol>
    <p class="footnote">이 화면은 연결된 순간 이후의 이벤트만 받습니다. 연결이 끊긴 동안의 내역은 복구하지 않으며, 새로고침하면 목록이 비워집니다.</p>
  </main>

  <script>
    const log = document.getElementById("event-log");
    const empty = document.getElementById("empty");
    const connection = document.getElementById("connection");
    const connectionText = document.getElementById("connection-text");
    const eventCount = document.getElementById("event-count");
    const originCount = document.getElementById("origin-count");
    const lastSeen = document.getElementById("last-seen");

    let count = 0;
    let lastEventAt = 0;

    const kindLabels = {
      "REQUEST": "REQUEST",
      "GET": "GET",
      "LOCK ACQUIRE": "LOCK ACQUIRE",
      "OPEN-METEO": "OPEN-METEO",
      "PUT": "PUT",
      "LOCK RELEASE": "LOCK RELEASE",
      "ERROR": "ERROR",
      "END": "END"
    };

    function setConnection(online) {
      connection.dataset.state = online ? "online" : "offline";
      connectionText.textContent = online ? "연결됨" : "연결 끊김 · 재연결 대기";
    }

    function cell(className, text) {
      const element = document.createElement("span");
      element.className = className;
      element.textContent = text;
      return element;
    }

    function appendEvent(data) {
      empty.hidden = true;

      const row = document.createElement("li");
      row.className = "event";
      row.dataset.kind = data.kind;
      if (data.kind === "REQUEST") row.classList.add("request-event");
      if (data.kind === "END") row.classList.add("end-event");

      row.append(cell("time", `+${data.elapsed_ms}ms`));
      row.append(cell("step", data.step || ""));
      row.append(cell("kind", kindLabels[data.kind] || data.kind));

      const body = document.createElement("span");
      body.className = "body";
      body.append(cell("message", data.message));
      if (data.target) body.append(cell("target", data.target));
      row.append(body);

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.append(cell("request", data.request_id));
      if (data.status !== null && data.status !== undefined) {
        const status = cell("status-chip", String(data.status));
        status.classList.add(data.status === 200 ? "ok" : "failed");
        meta.append(status);
      }
      row.append(meta);

      log.append(row);

      count += 1;
      eventCount.textContent = String(count);
      if (data.kind === "OPEN-METEO" && typeof data.calls === "number") {
        originCount.textContent = String(data.calls);
      }
      lastEventAt = Date.now();
      updateLastSeen();

      requestAnimationFrame(() => {
        window.scrollTo({ top: document.body.scrollHeight, behavior: "auto" });
      });
    }

    function updateLastSeen() {
      if (!lastEventAt) {
        lastSeen.textContent = "—";
        return;
      }
      const seconds = (Date.now() - lastEventAt) / 1000;
      lastSeen.textContent = seconds < 1 ? "방금" : `${seconds.toFixed(1)}초 전`;
    }

    setInterval(updateLastSeen, 250);

    const source = new EventSource("/monitor/events");
    source.addEventListener("ready", () => setConnection(true));
    source.onopen = () => setConnection(true);
    source.onerror = () => setConnection(false);
    source.onmessage = (message) => {
      try {
        appendEvent(JSON.parse(message.data));
      } catch (error) {
        console.error("모니터 이벤트를 해석하지 못했습니다", error);
      }
    };
  </script>
</body>
</html>
