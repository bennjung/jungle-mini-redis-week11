<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>날씨 조회 · Mini Redis 데모</title>
  <style>
    body { font-family: sans-serif; max-width: 42rem; margin: 3.5rem auto; padding: 0 1.5rem; line-height: 1.6; color: #25342e; background: #f4f7f2; }
    h1 { margin-bottom: .25rem; }
    .subtitle { margin-top: 0; color: #4c5f56; }
    .architecture { margin: 1.25rem 0 1.75rem; padding: .9rem 1rem; background: #ffffff; border: 1px solid #d2ddd5; border-radius: .5rem; }
    .architecture-title { margin: 0 0 .5rem; font-size: .82rem; font-weight: 700; color: #4c5f56; letter-spacing: .04em; }
    .architecture svg { display: block; width: 100%; height: auto; font-family: inherit; }
    label, select, button { font-size: 1rem; }
    select, button { padding: .65rem; margin: .5rem .5rem .5rem 0; }
    button { background: #245b43; color: white; border: 0; border-radius: .3rem; cursor: pointer; }
    button:disabled { opacity: .5; }
    #result { margin: 2rem 0; font-size: 1.4rem; }
    #error { color: #a52828; }
  </style>
</head>
<body>
  <h1>오늘의 날씨</h1>
  <p class="subtitle">Mini Redis 응답 재사용 데모</p>
  <section class="architecture" aria-label="시스템 구성도">
    <p class="architecture-title">시스템 구조</p>
    <svg viewBox="0 0 640 226" role="img" aria-label="FE 웹사이트, BE 서버, Mini Redis, 외부 날씨 API 연결 구조">
      <defs>
        <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 1 1 L 9 5 L 1 9 z" fill="#245b43" />
        </marker>
        <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 9 1 L 1 5 L 9 9 z" fill="#245b43" />
        </marker>
      </defs>

      <!-- FE <-> BE -->
      <line x1="146" y1="58" x2="228" y2="58" stroke="#245b43" stroke-width="1.6" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
      <text x="187" y="47" text-anchor="middle" font-size="11" fill="#4c5f56">GET /weather</text>

      <!-- BE <-> Mini Redis -->
      <line x1="376" y1="58" x2="484" y2="58" stroke="#245b43" stroke-width="1.6" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
      <text x="430" y="47" text-anchor="middle" font-size="11" font-weight="600" fill="#245b43">캐시 조회·저장</text>
      <text x="430" y="75" text-anchor="middle" font-size="11" fill="#4c5f56">/ 락</text>

      <!-- BE <-> 외부 날씨 API -->
      <line x1="302" y1="94" x2="302" y2="146" stroke="#245b43" stroke-width="1.6" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
      <text x="314" y="124" text-anchor="start" font-size="11" fill="#4c5f56">캐시 미스 시 호출</text>

      <!-- FE (웹사이트) -->
      <rect x="12" y="24" width="130" height="68" rx="8" fill="#f9fbf8" stroke="#97aea0" stroke-width="1.4" />
      <text x="77" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#25342e">FE (웹사이트)</text>
      <text x="77" y="73" text-anchor="middle" font-size="11" fill="#4c5f56">브라우저</text>

      <!-- BE (서버) -->
      <rect x="232" y="24" width="140" height="68" rx="8" fill="#ffffff" stroke="#245b43" stroke-width="1.8" />
      <text x="302" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#25342e">BE (서버)</text>
      <text x="302" y="73" text-anchor="middle" font-size="11" fill="#4c5f56">날씨 데모 (:8000)</text>

      <!-- Mini Redis -->
      <rect x="488" y="24" width="140" height="68" rx="8" fill="#edf5f0" stroke="#245b43" stroke-width="1.8" />
      <text x="558" y="53" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e4d39">Mini Redis</text>
      <text x="558" y="73" text-anchor="middle" font-size="11" fill="#3a5a4b">캐시 · 락 (:5000)</text>

      <!-- 외부 날씨 API -->
      <rect x="232" y="150" width="140" height="64" rx="8" fill="#f9fbf8" stroke="#97aea0" stroke-width="1.4" stroke-dasharray="4 3" />
      <text x="302" y="178" text-anchor="middle" font-size="13.5" font-weight="700" fill="#25342e">외부 날씨 API</text>
      <text x="302" y="197" text-anchor="middle" font-size="11" fill="#4c5f56">Open-Meteo</text>
    </svg>
  </section>
  <label for="place">장소</label>
  <select id="place">
    <option value="37.566,126.978">서울특별시</option>
    <option value="35.179,129.076">부산광역시</option>
    <option value="35.872,128.601">대구광역시</option>
    <option value="37.456,126.705">인천광역시</option>
    <option value="35.160,126.852">광주광역시</option>
    <option value="36.351,127.385">대전광역시</option>
    <option value="35.538,129.311">울산광역시</option>
    <option value="36.480,127.289">세종특별자치시</option>
    <option value="current">현재 위치</option>
  </select>
  <button id="lookup" type="button">날씨 조회</button>
  <p id="result" aria-live="polite">장소를 선택하고 날씨를 조회하세요.</p>
  <p id="error" role="alert"></p>
  <p><small>날씨 데이터: <a href="https://open-meteo.com/">Open-Meteo</a> · 처리 과정은 데모 서버 터미널을 확인하세요.</small></p>
  <script>
    const place = document.getElementById("place");
    const button = document.getElementById("lookup");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    button.addEventListener("click", async () => {
      error.textContent = "";
      result.textContent = "조회 중…";
      button.disabled = true;
      try {
        let coordinates;
        if (place.value === "current") {
          if (!navigator.geolocation) throw new Error("현재 위치를 사용할 수 없습니다. 다른 장소를 선택해 주세요.");
          const position = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 10000}));
          coordinates = [position.coords.latitude, position.coords.longitude];
        } else {
          coordinates = place.value.split(",");
        }
        const params = new URLSearchParams({latitude: coordinates[0], longitude: coordinates[1]});
        const response = await fetch(`/weather?${params}`);
        if (!response.ok) throw new Error("날씨를 가져오지 못했습니다.");
        const data = await response.json();
        result.textContent = `${place.selectedOptions[0].textContent} · ${data.current.temperature_2m}°C`;
      } catch (err) {
        result.textContent = "";
        error.textContent = typeof err.code === "number"
          ? "현재 위치를 가져오지 못했습니다. 다른 장소를 선택해 주세요."
          : (err.message || "날씨를 가져오지 못했습니다.");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
